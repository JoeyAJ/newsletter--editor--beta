function newArticle(){return {id:uid(),title:'',body:'',image:'',qr:'',extraImages:[]}}
function normalizeArticle(a,legacy){
 a=a&&typeof a==='object'?a:{};
 const out={...a,id:a.id||uid(),title:String(a.title??''),body:String(a.body??''),image:typeof a.image==='string'?a.image:''};
 if(legacy){
  for(const [marker,tag] of LEGACY_SAMPLE_MARKERS){
   if(out.body===marker||out.body.startsWith(marker+'\n')){out.body=out.body.slice(marker.length).replace(/^\n/,'');out.sampleTag=tag;break}
  }
  if(LEGACY_DEFAULT_TITLES.includes(out.title))out.title='';
  if(LEGACY_DEFAULT_BODIES.includes(out.body))out.body='';
 }
 if(out.sampleTag!=='article'&&out.sampleTag!=='event')delete out.sampleTag;
 out.extraImages=(Array.isArray(a.extraImages)?a.extraImages:[]).map(im=>typeof im==='string'?{src:im,ratio:'original',fit:'contain',x:50,y:50}:im).filter(im=>im&&typeof im.src==='string'&&im.src).map(im=>im.id?im:{...im,id:shortId()});
 return out;
}
function normalizePart(x,legacy){
 x=x&&typeof x==='object'?x:{};
 let title=String(x.title??'');if(legacy&&LEGACY_DEFAULT_PARTS.includes(title))title='';
 const list=Array.isArray(x.articles)?x.articles:Array.isArray(x.stories)?x.stories:[];
 const part={id:x.id||uid(),title,position:POSITIONS.includes(x.position)?x.position:'full',articles:list.map(a=>normalizeArticle(a,legacy))};
 if(x.contOf)part.contOf=String(x.contOf);
 return part;
}
function normalizePage(p,legacy){
 p=p&&typeof p==='object'?p:{};
 return {...(p.autoCreated?{autoCreated:true}:{}),id:p.id||uid(),header:HEADERS.includes(p.header)?p.header:'full',layout:LAYOUTS.includes(p.layout)?p.layout:'mode1',headingStyle:STYLES.includes(p.headingStyle)?p.headingStyle:'style1',parts:(Array.isArray(p.parts)?p.parts:[]).map(x=>normalizePart(x,legacy))};
}
/* Converts the old "left/right columns + extra parts" format into the unified Part model. */
function legacyPage(p,root){
 const pick=k=>p[k]!==undefined?p[k]:root[k];
 const parts=[
  {title:pick('leftLabel'),position:'left',articles:Array.isArray(pick('left'))?pick('left'):[]},
  {title:pick('rightLabel'),position:'right',articles:Array.isArray(pick('right'))?pick('right'):[]}
 ];
 for(const x of Array.isArray(p.parts)?p.parts:[])parts.push(x);
 return normalizePage({layout:pick('layout'),headingStyle:pick('headingStyle'),parts},true);
}
function normalizeData(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw))throw new Error('invalid');
 const out={schema:2};
 for(const k of META_KEYS)out[k]=raw[k]==null?'':String(raw[k]);
 if(raw.mastTitle===undefined)out.mastTitle='NEWSLETTER';
 if(raw.schema===2){
  if(!Array.isArray(raw.pages))throw new Error('invalid');
  out.pages=raw.pages.map(p=>normalizePage(p,false));
 }else{
  const legacyPages=Array.isArray(raw.pages)&&raw.pages.length?raw.pages:null;
  if(!legacyPages&&!(Array.isArray(raw.left)&&Array.isArray(raw.right)))throw new Error('invalid');
  out.pages=(legacyPages||[raw]).map(p=>legacyPage(p&&typeof p==='object'?p:{},raw));
 }
 if(!out.pages.length)out.pages=[normalizePage({parts:[{title:'',position:'left'},{title:'',position:'right'}]},false)];
 return out;
}

function loadData(){

 try{rawText=localStorage.getItem(STORAGE_KEY);raw=rawText?JSON.parse(rawText):null}catch(e){raw=null}
 if(!raw){
  if(rawText){try{localStorage.setItem(LEGACY_BACKUP_KEY+'-unreadable',rawText)}catch(e){}}
  return sample();
 }
 try{
  if(raw.schema!==2){try{if(!localStorage.getItem(LEGACY_BACKUP_KEY))localStorage.setItem(LEGACY_BACKUP_KEY,rawText)}catch(e){}}
  return normalizeData(raw);
 }catch(e){
  try{localStorage.setItem(LEGACY_BACKUP_KEY+'-unreadable',rawText)}catch(err){}
  return sample();
 }
}

/* ===== In-page dialogs =====
   The browser's own confirm and alert boxes are silently blocked in sandboxed previews (a confirm then
   answers "no", so deleting did nothing). These dialogs work everywhere and follow the interface language. */
function uiDialog(message,withCancel){
 return new Promise(resolve=>{
  const prev=document.activeElement,wrap=document.createElement('div');
  wrap.className='ui-dialog-overlay';
  wrap.innerHTML=`<div class="ui-dialog" role="${withCancel?'alertdialog':'dialog'}" aria-modal="true" aria-describedby="uiDialogMsg"><p id="uiDialogMsg"></p><div class="ui-dialog-actions">${withCancel?`<button type="button" class="btn secondary" id="uiDialogCancel">${esc(t('dialog.cancel'))}</button>`:''}<button type="button" class="btn" id="uiDialogOk">${esc(t('dialog.ok'))}</button></div></div>`;
  wrap.querySelector('#uiDialogMsg').textContent=message;
  const close=v=>{document.removeEventListener('keydown',onKey,true);wrap.remove();if(prev&&prev.isConnected)prev.focus();resolve(v)};
  const onKey=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close(false)}};
  wrap.addEventListener('click',e=>{if(e.target.id==='uiDialogOk')close(true);else if(e.target.id==='uiDialogCancel'||e.target===wrap)close(false)});
  document.addEventListener('keydown',onKey,true);
  document.body.appendChild(wrap);wrap.querySelector('#uiDialogOk').focus();
 });
}
const uiConfirm=msg=>uiDialog(msg,true),uiAlert=msg=>uiDialog(msg,false);

/* ===== Persistence ===== */
let saveTimer=null,saveState='idle',lastSaved=null,storageWarned=false;
function persist(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,250)}
function saveNow(){
 clearTimeout(saveTimer);saveTimer=null;
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));saveState='saved';lastSaved=new Date()}
 catch(err){saveState='failed';if(!storageWarned){storageWarned=true;uiAlert(t('msg.storageFull'))}}
 paintStatus();
}
window.addEventListener('pagehide',()=>{if(saveTimer)saveNow()});
window.addEventListener('beforeunload',()=>{if(saveTimer)saveNow()});
function paintStatus(){
 const el=$('#saveStatus');if(!el)return;
 const text=saveState==='failed'?t('status.failed'):saveState==='saved'&&lastSaved?t('status.saved',{time:lastSaved.toLocaleTimeString(HTML_LANG[currentLanguage],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}):t('status.autosave');
 el.classList.toggle('is-error',saveState==='failed');
 el.innerHTML='<span aria-hidden="true">●</span> '+esc(text);
}

/* ===== Preview ===== */
/* Body markup is shared by the preview and the page-flow measurement so both lay out identically. */
const RATIO_CSS={square:'1/1',landscape:'4/3',wide:'16/9',portrait:'3/4'};
/* One picture in a collage or inline row. A single picture keeps its own proportions; several pictures
   share a tidy 4:3 cell (or the ratio chosen for that picture) so rows line up. */
function figImg(x,cols,mode){
 const natural=x.w&&x.h?`${x.w}/${x.h}`:'4/3',fixed=RATIO_CSS[x.ratio];
 const fit=fixed?'cover':cols===1?(x.fit==='cover'?'cover':'contain'):(mode==='grid-contain'?'contain':'cover');
 const pos=`object-fit:${fit};object-position:${num(x.x)}% ${num(x.y)}%`,src=`src="${esc(x.src)}" alt="${esc(t('preview.extraImageAlt'))}"`;
 /* A lone picture keeps its proportions, is centred and capped in height; width/height attributes give
    the browser its size before decoding so page-flow measuring is exact. */
 if(cols===1&&!fixed&&x.w&&x.h)return `<img class="article-image extra-preview gimg single natural" width="${x.w}" height="${x.h}" style="${pos}" ${src}>`;
 return `<img class="article-image extra-preview gimg${cols===1?' single':''}" style="aspect-ratio:${fixed||(cols===1?natural:'4/3')};${pos}" ${src}>`;
}
/* Body text with image codes ([[IMG:id]]) turned into pictures at that spot; codes on one line sit side by side. */
function richBody(a,text){
 const byId=new Map(a.extraImages.map(x=>[x.id,x]));let html='',buf=[];
 const flush=()=>{if(buf.length){html+=esc(buf.join('\n'));buf=[]}};
 for(const line of String(text).split('\n')){
  const ids=[...line.matchAll(IMG_TOKEN)].map(m=>m[1]).filter(id=>byId.has(id));
  if(!ids.length){buf.push(line);continue}
  const rest=line.replace(IMG_TOKEN,'').trim();if(rest)buf.push(rest);
  flush();const k=Math.min(ids.length,3);
  html+=`<div class="inline-figs" style="grid-template-columns:repeat(${k},minmax(0,1fr))">${ids.map(id=>figImg(byId.get(id),ids.length===1?1:k,'grid-cover')).join('')}</div>`;
 }
 flush();return html;
}
function galleryHTML(a,pos){
 const placed=placedIds(a.body),list=a.extraImages.filter(x=>!placed.has(x.id));
 if(!list.length)return '';
 const mode=['grid-cover','grid-contain','stack'].includes(a.galleryMode)?a.galleryMode:'grid-cover';
 if(mode==='stack')return `<div class="extra-gallery stack">${list.map(x=>{const ratio=CROPS.includes(x.ratio)&&x.ratio!=='original'?'crop-'+x.ratio:'crop-original';const fit=x.ratio&&x.ratio!=='original'?'cover':(x.fit==='cover'?'cover':'contain');return `<img class="article-image extra-preview ${ratio}" style="object-fit:${fit};object-position:${num(x.x)}% ${num(x.y)}%" src="${esc(x.src)}" alt="${esc(t('preview.extraImageAlt'))}">`}).join('')}</div>`;
 const n=list.length,want=Number(a.galleryCols);
 const cols=want>=1&&want<=4?Math.min(want,n):pos==='full'?(n<=4?n:n<=6?3:4):(n===1?1:2);
 return `<div class="extra-gallery" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${list.map(x=>figImg(x,cols,mode)).join('')}</div>`;
}

/* ===== Actions ===== */
/* ===== Preview view: single page, two pages side by side, or all pages as thumbnails =====
   Sheets keep their real A4 size and are scaled with a transform, so editing, overflow checks and
   exports keep working on true measurements (flow and PNG switch to single view while they run). */
const VIEW_KEY='woosong-ui-preview-view',VIEWS=['single','two','grid'];
let previewView=(()=>{try{const v=localStorage.getItem(VIEW_KEY);if(VIEWS.includes(v))return v}catch(e){}return 'single'})();
function layoutPreview(){
 const stack=$('#pagesStack'),ws=$('.workspace');if(!stack||!ws)return;
 const W=Math.max(200,ws.clientWidth-40),gap=18;let cols=1,scale=1;
 if(previewView==='two'){cols=Math.min(2,data.pages.length)||1;scale=Math.min(1,(W-gap*(cols-1))/cols/794)}
 else if(previewView==='grid'){cols=Math.max(2,Math.floor((W+gap)/(240+gap)));scale=Math.min(0.42,(W-gap*(cols-1))/cols/794)}
 stack.dataset.view=previewView;stack.style.setProperty('--sheet-scale',scale.toFixed(4));stack.style.setProperty('--sheet-cols',cols);
 document.querySelectorAll('.pv-btn').forEach(b=>{const on=b.dataset.view===previewView;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))});
 const hint=$('.pv-hint');if(hint)hint.hidden=previewView==='single';
}
function setPreviewView(v){
 if(!VIEWS.includes(v))return;previewView=v;try{localStorage.setItem(VIEW_KEY,v)}catch(e){}
 layoutPreview();$('#preview')?.scrollIntoView({block:'nearest'});
}
/* Temporarily show sheets at full size; returns a function that restores the chosen view. */
function useSingleView(){const keep=previewView;if(keep==='single')return ()=>{};previewView='single';layoutPreview();return ()=>{previewView=keep;layoutPreview()}}
if(window.ResizeObserver)new ResizeObserver(()=>layoutPreview()).observe(document.querySelector('.workspace'));
document.addEventListener('dblclick',e=>{const sheet=e.target.closest('#pagesStack .nex-sheet');if(!sheet||previewView==='single')return;const i=Number(sheet.dataset.sheet);if(i!==pageIndex)selectPage(i);setPreviewView('single');$('#preview')?.scrollIntoView({block:'start'})});
function selectPage(i){
 if(i<0||i>=data.pages.length)return;
 pageIndex=i;renderDesign();renderContent();
 document.querySelectorAll('#pagesStack .nex-sheet').forEach((el,k)=>sheetAttrs(el,k));
 $('#preview')?.scrollIntoView({block:'start',behavior:'smooth'});
}

/* Removes an image code; a line left empty by the removal is dropped, other lines keep their breaks. */
function stripToken(body,id){
 const token=`[[IMG:${id}]]`,lines=String(body).split('\n'),out=[];
 for(const line of lines){if(!line.includes(token)){out.push(line);continue}const rest=line.split(token).join('').replace(/[ \t]{2,}/g,' ').trim();if(rest)out.push(rest)}
 return out.join('\n');
}
const lastCaret=new Map();
['keyup','click','select','input'].forEach(type=>document.addEventListener(type,e=>{const ta=e.target;if(ta&&ta.matches&&ta.matches('textarea[data-art-field="body"]')){const aid=ta.closest('[data-aid]')?.dataset.aid;if(aid)lastCaret.set(aid,ta.selectionStart)}},true));
function move(list,i,d){const n=i+d;if(n<0||n>=list.length)return false;[list[i],list[n]]=[list[n],list[i]];return true}

function readImage(file,callback,kind){
 if(!file)return;
 const supported=/\.(png|jpe?g|webp|gif|bmp|heic|heif)$/i.test(file.name)||/^image\//.test(file.type);
 if(!supported){uiAlert(t('msg.imgUnsupported'));return}
 if(file.size>25*1024*1024){uiAlert(t('msg.imgTooLarge'));return}
 const url=URL.createObjectURL(file),img=new Image();
 img.onload=()=>{URL.revokeObjectURL(url);try{
  const max=kind==='logo'?700:1400,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
  const ctx=canvas.getContext('2d');if(!ctx)throw Error('Canvas unavailable');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
  const result=canvas.toDataURL('image/jpeg',.78);
  if(result.length>2.5e6){uiAlert(t('msg.imgStillLarge'));return}
  callback(result,canvas.width,canvas.height);
 }catch(err){uiAlert(t('msg.imgProcess'))}};
 img.onerror=()=>{URL.revokeObjectURL(url);uiAlert(t('msg.imgRead'))};
 img.src=url;
}
function handleUpload(input){
 const kind=input.dataset.upload,files=Array.from(input.files||[]);input.value='';

/* ===== Page flow: continue overflowing content on the next A4 page =====
   The overflowing page is rendered for real and measured; text is cut at the last position that still
   fits (preferring line/sentence breaks), extra images move first, and whole articles move when even an
   empty body does not fit. Continuations keep the Part heading, column position and text style. */
let undoSnapshot=null,flowMessage=[],flowBusy=false;
function takeUndo(){undoSnapshot={json:JSON.stringify(data),page:pageIndex};flowMessage=[]}

 if(!undoSnapshot||!await uiConfirm(t('flow.confirmUndo'))||!undoSnapshot)return;
 data=JSON.parse(undoSnapshot.json);pageIndex=Math.min(undoSnapshot.page,data.pages.length-1);undoSnapshot=null;flowMessage=[];
 saveNow();renderPanels();renderPreview();
}
function afterFlow(msg){flowMessage=[msg];persist();renderPanels();renderPreview()}
function ensureNextPage(i){
 if(!data.pages[i+1]){const pg=data.pages[i];const np=normalizePage({header:pg.header,layout:pg.layout,headingStyle:pg.headingStyle,parts:[]},false);np.autoCreated=true;data.pages.splice(i+1,0,np)}
 return data.pages[i+1];
}
function contPartFor(i,part){
 const next=ensureNextPage(i),src=data.pages[i].parts;
 let cont=next.parts.find(p=>p.contOf===part.id);
 if(!cont){
  cont={id:uid(),title:part.title,position:part.position,contOf:part.id,articles:[]};
  const order=x=>src.findIndex(p=>p.id===x.contOf),mine=order(cont);let at=0;
  while(at<next.parts.length&&next.parts[at].contOf&&order(next.parts[at])>-1&&order(next.parts[at])<mine)at++;
  next.parts.splice(at,0,cont);

function dropEmptySource(i,part,cont){

const STYLE_KEYS=['titleSize','bodySize','fontFamily','titleBold','bodyBold'];
const STYLE_KEYS_ALL=[...STYLE_KEYS,'galleryMode','galleryCols'];
/* extrasKeep counts end-of-article (gallery) pictures that stay; pictures placed in the body travel with their code. */
function splitArticle(i,part,a,extrasKeep,cut,auto){
 const cont=contPartFor(i,part),headText=a.body.slice(0,cut).replace(/\s+$/,''),rest=a.body.slice(headText.length),lead=rest.match(/^\s*/)[0],join=lead;
 const headIds=placedIds(headText),tailIds=placedIds(rest);
 const gallery=a.extraImages.filter(x=>!headIds.has(x.id)&&!tailIds.has(x.id)),keepGallery=new Set(gallery.slice(0,extrasKeep).map(x=>x.id));
 const stays=x=>headIds.has(x.id)||keepGallery.has(x.id);
 const tail={id:uid(),title:a.title,body:rest.slice(lead.length),image:'',qr:'',extraImages:a.extraImages.filter(x=>!stays(x)),continuedFrom:a.id,contJoin:join};
 if(auto)tail.autoFlow=true;else tail.manualSplit=true;
 for(const k of STYLE_KEYS_ALL)if(a[k]!==undefined)tail[k]=a[k];
 a.body=headText;a.extraImages=a.extraImages.filter(stays);a.continuesNext=true;
 const existing=cont.articles.find(x=>x.continuedFrom===a.id);
 if(existing){existing.body=tail.body+(existing.contJoin||'')+existing.body;existing.contJoin=join;existing.extraImages=tail.extraImages.concat(existing.extraImages)}

 const k=cont.articles.findIndex(x=>x.continuedFrom===a.id);
 if(k>-1){const tail=cont.articles[k];a.body=a.body+(tail.contJoin||'')+tail.body;a.extraImages=a.extraImages.concat(tail.extraImages);if(tail.continuesNext)a.continuesNext=true;else delete a.continuesNext;cont.articles.splice(k,1)}

const sheetEl=i=>document.querySelector(`#pagesStack .nex-sheet[data-sheet="${i}"]`);
function sheetOverflows(el){const f=el.querySelector('.footer');return f?f.offsetTop+f.offsetHeight>el.clientHeight:el.scrollHeight>el.clientHeight+2}
async function decodeImages(root){await Promise.all([...root.querySelectorAll('img')].map(img=>img.complete&&img.naturalWidth?null:img.decode().catch(()=>{})))}
function safeCut(text,pos){for(const m of String(text).matchAll(IMG_TOKEN)){if(pos>m.index&&pos<m.index+m[0].length)return m.index}return pos}
function niceCut(text,max){
 if(max>=text.length)return text.length;
 const floor=Math.floor(max*0.6);
 for(const re of [/\n/g,/[。！？.!?；;]/g,/[，、,\s]/g]){let best=-1,m;re.lastIndex=0;while((m=re.exec(text))&&m.index<max){if(m.index+1>floor)best=m.index+1}if(best>0)return best}

/* Returns {keep, cut} for a split that fits, or null when the article must move as a whole. */
function measureSplit(sheet,el,a){
 const bodyEl=el.querySelector('.article-body'),extras=[...el.querySelectorAll('.extra-gallery .extra-preview')],footer=sheet.querySelector('.footer');
 /* Judge only this article against the line where the footer must start, so another overflowing column
    does not force this article to move whole. */
 const gap=footer?Math.max(0,footer.getBoundingClientRect().top-el.getBoundingClientRect().bottom):0;
 const limit=sheet.getBoundingClientRect().top+sheet.clientHeight-(footer?footer.offsetHeight:0)-gap;
 const fits=()=>el.getBoundingClientRect().bottom<=limit+0.5;
 const trial=Object.assign({},a,{continuesNext:true});
 for(let keep=extras.length-1;keep>=0;keep--){
  extras[keep].remove();bodyEl.innerHTML=bodyInner(trial,a.body);
  if(fits()){if(keep===0&&!a.body.trim()&&!a.image)break;return {keep,cut:a.body.length}}
 }
 let lo=0,hi=a.body.length-1,best=-1;
 el.querySelector('.extra-gallery')?.remove();
 while(lo<=hi){const mid=(lo+hi)>>1;bodyEl.innerHTML=bodyInner(trial,a.body.slice(0,safeCut(a.body,mid)));if(!fits())hi=mid-1;else{best=mid;lo=mid+1}}

async function flowPage(i){

  sheet.innerHTML=pageHTML(data.pages[i]);await decodeImages(sheet);
  if(!sheetOverflows(sheet))return changed;
  const arts=[...sheet.querySelectorAll('.article[data-aid]')];if(!arts.length)return 'stuck';
  const el=arts.reduce((m,x)=>x.getBoundingClientRect().bottom>m.getBoundingClientRect().bottom?x:m);
  const part=data.pages[i].parts.find(p=>p.articles.some(x=>x.id===el.dataset.aid)),a=part.articles.find(x=>x.id===el.dataset.aid);
  const plan=measureSplit(sheet,el,a);

  else{const first=el.closest('.column')?.querySelector('.article')===el;if(first)return 'stuck';moveWhole(i,part,a,true)}

/* Older pictures have no stored size; read it once so layout (and page-flow measuring) is exact before decoding. */
async function ensureImageSizes(){

 await Promise.all(todo.map(x=>new Promise(res=>{const im=new Image();im.onload=()=>{x.w=im.naturalWidth;x.h=im.naturalHeight;res()};im.onerror=res;im.src=x.src})));

}
/* Undo earlier automatic continuations (not manual splits) so a re-run lays everything out afresh. */
function rejoinAuto(){
 for(let j=data.pages.length-1;j>=1;j--){
  const prev=data.pages[j-1],page=data.pages[j];
  let removed=false;
  for(const cp of [...page.parts]){
   const src=cp.contOf&&prev.parts.find(p=>p.id===cp.contOf);if(!src)continue;
   while(cp.articles.length){
    const x=cp.articles[0],last=src.articles[src.articles.length-1];
    if(!x.manualSplit&&last&&x.continuedFrom===last.id){last.body=last.body+(x.contJoin||'')+x.body;last.extraImages=last.extraImages.concat(x.extraImages);if(x.continuesNext)last.continuesNext=true;else delete last.continuesNext;cp.articles.shift()}

async function autoFlow(){

  downloadBlob(makeZip(files),`${fileBase()}-png.zip`);
 }catch(e){uiAlert(t('msg.pngFailed',{error:e.message})+'\n'+t('msg.pngAdvice'))}
 finally{btn.disabled=false;label.textContent=t('export.pngAll');restoreView()}
}
/* Minimal ZIP writer (stored entries, no compression — PNG data is already compressed), so no extra library is needed. */
const CRC_TABLE=(()=>{const tb=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;tb[n]=c>>>0}return tb})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_TABLE[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function makeZip(files){
 const enc=new TextEncoder(),parts=[],central=[],d=new Date();let offset=0,centralSize=0;
 const time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
 for(const f of files){
  const name=enc.encode(f.name),crc=crc32(f.data),size=f.data.length;
  const h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,time,true);h.setUint16(12,date,true);
  h.setUint32(14,crc,true);h.setUint32(18,size,true);h.setUint32(22,size,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
  parts.push(h.buffer,name,f.data);
  const c=new DataView(new ArrayBuffer(46));
  c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,time,true);c.setUint16(14,date,true);
  c.setUint32(16,crc,true);c.setUint32(20,size,true);c.setUint32(24,size,true);c.setUint16(28,name.length,true);c.setUint32(42,offset,true);
  central.push(c.buffer,name);centralSize+=46+name.length;offset+=30+name.length+size;
 }
 const e=new DataView(new ArrayBuffer(22));
 e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,centralSize,true);e.setUint32(16,offset,true);
 return new Blob([...parts,...central,e.buffer],{type:'application/zip'});
}

/* ===== Resizable editor / preview panes ===== */
(function initResize(){
 const app=$('.app'),handle=$('.nex-pane-handle');if(!app||!handle)return;
 let w=440;try{w=Number(localStorage.getItem(WIDTH_KEY))||440}catch(e){}
 const update=n=>{w=Math.min(Math.max(300,n),Math.max(320,innerWidth-340));app.style.setProperty('--nex-sidebar-width',w+'px')};update(w);
 const finish=()=>{handle.classList.remove('dragging');try{localStorage.setItem(WIDTH_KEY,String(w))}catch(e){}};
 handle.addEventListener('pointerdown',e=>{if(innerWidth<=850)return;handle.setPointerCapture(e.pointerId);handle.classList.add('dragging');e.preventDefault()});
 handle.addEventListener('pointermove',e=>{if(handle.hasPointerCapture(e.pointerId))update(e.clientX-app.getBoundingClientRect().left)});
 handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish);
 handle.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();update(w+(e.key==='ArrowRight'?24:-24));finish()}});
 window.addEventListener('resize',()=>update(w));
})();
